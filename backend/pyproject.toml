[project]
name = "cerno"
version = "0.0.0"
description = "AI analyst that investigates metric changes with verifiable evidence"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]
# Throwaway M1 spikes (spikes/ at repo root). Kept out of the product's runtime deps.
spikes = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pydantic>=2.9",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerno"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["cerno", "tests", "../spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "pyarrow.*", "duckdb.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real Claude API (costs money; run manually)",
    "linux: needs Linux-only features (rlimits, namespaces, uid switching)",
]
